<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 6px;
            background: linear-gradient(180deg, #fde68a, #f59e0b);
            color: #78350f;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 3px 0 #b45309;
        }
        .tile .val {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: 700;
            opacity: .8;
        }
        .tile.blank { background: linear-gradient(180deg, #e2e8f0, #94a3b8); color: #475569; box-shadow: 0 3px 0 #64748b; }
        .key-hover:active { transform: translateY(2px); }
        .word-card { transition: box-shadow .15s, border-color .15s, transform .1s; }
        .word-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">

        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 mb-3 text-xs font-bold tracking-wider text-emerald-700 uppercase bg-emerald-100 rounded-full">
                Scrabble Helper
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">Unscramble &amp; Suggest Plays</h1>
            <p class="text-slate-500 mt-2">Set each player's tiles, then find every word they can play.</p>
        </header>

        <!-- Players -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-slate-800">Players</h2>
                <button id="add-player" class="text-sm font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition-colors">+ Add player</button>
            </div>
            <div id="player-tabs" class="flex flex-wrap gap-2"></div>
        </section>

        <!-- Rack -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
            <div class="flex items-center justify-between mb-4 gap-4 flex-wrap">
                <h2 class="font-bold text-slate-800">
                    <span id="active-player-name">Player 1</span>'s rack
                </h2>
                <div class="flex items-center gap-2">
                    <input id="rack-input" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. aeinst_"
                        class="w-48 px-3 py-2 border border-slate-300 rounded-lg text-lg tracking-widest uppercase focus:outline-none focus:ring-2 focus:ring-emerald-400">
                    <button id="clear-rack" class="text-sm text-slate-500 hover:text-slate-800 px-2 py-2 rounded-lg hover:bg-slate-100">Clear</button>
                </div>
            </div>

            <div id="rack-tiles" class="flex flex-wrap gap-2 min-h-[44px] mb-4 items-center">
                <span class="text-sm text-slate-400">No tiles yet — type above or use the keyboard below.</span>
            </div>

            <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-1.5"></div>
            <p class="text-xs text-slate-400 mt-3">Tip: add a blank tile with <span class="font-mono font-bold">_</span>. Max 12 tiles (fewer with blanks).</p>
        </section>

        <!-- Options + action -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 items-end">
                <label class="text-sm">
                    <span class="block text-slate-500 mb-1">Sort by</span>
                    <select id="sort" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        <option value="length">Longest first</option>
                        <option value="score">Highest score</option>
                    </select>
                </label>
                <label class="text-sm">
                    <span class="block text-slate-500 mb-1">Min length</span>
                    <input id="min-length" type="number" min="2" max="12" value="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400">
                </label>
                <label class="text-sm">
                    <span class="block text-slate-500 mb-1">Max results</span>
                    <input id="limit" type="number" min="1" max="500" value="100" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400">
                </label>
                <button id="solve" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-lg shadow-sm transition-colors">Unscramble</button>
            </div>
        </section>

        <!-- Results -->
        <section id="results-section" class="hidden">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                <h2 class="font-bold text-slate-800">Playable words <span id="result-count" class="text-slate-400 font-normal"></span></h2>
                <p id="anagram-note" class="text-sm text-emerald-700 hidden"></p>
            </div>
            <div id="words" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
            <p class="text-xs text-slate-400 mt-5">
                Word data by <a href="https://wordsohard.com" target="_blank" rel="noopener" class="text-emerald-600 hover:underline">WordSoHard</a>.
            </p>
        </section>

        <div id="status" class="mt-6 text-center text-slate-500 hidden"></div>
        <div id="error" class="mt-6 text-center text-red-600 font-medium hidden"></div>
    </div>

    <!-- Definition modal -->
    <div id="modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[80vh] overflow-y-auto p-6">
            <div class="flex items-start justify-between gap-4">
                <h3 id="def-word" class="text-2xl font-extrabold text-slate-900"></h3>
                <button id="close-modal" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
            </div>
            <div id="def-body" class="mt-3 text-slate-600"></div>
            <p id="def-attr" class="mt-4 text-xs text-slate-400"></p>
        </div>
    </div>

    <script>
        const API = 'https://wordsohard.com/api/v1';
        const VALUES = { a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,k:5,l:1,m:3,n:1,o:1,p:3,q:10,r:1,s:1,t:1,u:1,v:4,w:4,x:8,y:4,z:10 };
        const STORE = 'scrabble-helper-players';

        let players = [];
        let activeId = null;
        let lastRack = '';

        const $ = (id) => document.getElementById(id);

        function loadPlayers() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORE));
                if (Array.isArray(saved) && saved.length) return saved;
            } catch (e) {}
            return [{ id: Date.now(), name: 'Player 1', tiles: '' }];
        }

        function savePlayers() {
            localStorage.setItem(STORE, JSON.stringify(players));
        }

        function activePlayer() {
            return players.find(p => p.id === activeId) || players[0];
        }

        function normalize(raw) {
            return (raw || '')
                .toLowerCase()
                .replace(/[^a-z_*]/g, '')
                .replace(/\*/g, '_')
                .slice(0, 12);
        }

        // ---- Players UI ----
        function renderPlayers() {
            const tabs = $('player-tabs');
            tabs.innerHTML = '';
            players.forEach((p, i) => {
                const active = p.id === activeId;
                const wrap = document.createElement('div');
                wrap.className = 'flex items-center rounded-lg border ' +
                    (active ? 'border-emerald-400 bg-emerald-50' : 'border-slate-200 bg-slate-50');

                const btn = document.createElement('button');
                btn.className = 'px-3 py-2 text-sm font-semibold ' + (active ? 'text-emerald-700' : 'text-slate-600');
                btn.textContent = p.name;
                btn.addEventListener('click', () => setActive(p.id));
                wrap.appendChild(btn);

                const rename = document.createElement('button');
                rename.className = 'px-2 text-slate-400 hover:text-slate-700';
                rename.title = 'Rename';
                rename.textContent = '\u270E';
                rename.addEventListener('click', () => {
                    const name = prompt('Player name', p.name);
                    if (name && name.trim()) { p.name = name.trim().slice(0, 20); savePlayers(); renderPlayers(); renderRack(); }
                });
                wrap.appendChild(rename);

                if (players.length > 1) {
                    const del = document.createElement('button');
                    del.className = 'px-2 text-slate-400 hover:text-red-600';
                    del.title = 'Remove';
                    del.textContent = '\u00D7';
                    del.addEventListener('click', () => {
                        players = players.filter(x => x.id !== p.id);
                        if (activeId === p.id) activeId = players[0].id;
                        savePlayers(); renderPlayers(); renderRack();
                    });
                    wrap.appendChild(del);
                }

                tabs.appendChild(wrap);
            });
        }

        function setActive(id) {
            activeId = id;
            renderPlayers();
            renderRack();
        }

        // ---- Rack UI ----
        function tileEl(letter) {
            const el = document.createElement('div');
            const isBlank = letter === '_';
            el.className = 'tile' + (isBlank ? ' blank' : '');
            el.innerHTML = (isBlank ? '&nbsp;' : letter.toUpperCase()) +
                '<span class="val">' + (isBlank ? 0 : (VALUES[letter] || 0)) + '</span>';
            return el;
        }

        function renderRack() {
            const p = activePlayer();
            $('active-player-name').textContent = p.name;
            $('rack-input').value = p.tiles;

            const holder = $('rack-tiles');
            holder.innerHTML = '';
            if (!p.tiles) {
                holder.innerHTML = '<span class="text-sm text-slate-400">No tiles yet — type above or use the keyboard below.</span>';
            } else {
                for (const ch of p.tiles) holder.appendChild(tileEl(ch));
            }
            savePlayers();
        }

        function setTiles(raw) {
            const p = activePlayer();
            p.tiles = normalize(raw);
            renderRack();
        }

        function buildKeyboard() {
            const kb = $('keyboard');
            kb.innerHTML = '';
            for (let i = 0; i < 26; i++) {
                const letter = String.fromCharCode(97 + i);
                const b = document.createElement('button');
                b.className = 'key-hover py-2 rounded-md bg-slate-100 hover:bg-slate-200 text-sm font-bold text-slate-700';
                b.textContent = letter.toUpperCase();
                b.addEventListener('click', () => addTile(letter));
                kb.appendChild(b);
            }
            const blank = document.createElement('button');
            blank.className = 'key-hover py-2 rounded-md bg-slate-700 hover:bg-slate-800 text-xs font-bold text-white';
            blank.textContent = 'BLANK';
            blank.addEventListener('click', () => addTile('_'));
            kb.appendChild(blank);
        }

        function addTile(ch) {
            const p = activePlayer();
            if (p.tiles.length >= 12) return flashError('A rack can hold at most 12 tiles.');
            if (ch === '_' && (p.tiles.match(/_/g) || []).length >= 2) return flashError('Only two blank tiles are allowed.');
            p.tiles = normalize(p.tiles + ch);
            renderRack();
        }

        // ---- API ----
        async function unscramble() {
            const p = activePlayer();
            const rack = p.tiles;
            if (rack.length < 2) return flashError('Add at least two tiles to unscramble.');
            if (rack.replace(/_/g, '').length === 0) return flashError('Add at least one letter tile.');

            const minLength = Math.max(2, parseInt($('min-length').value, 10) || 2);
            const limit = Math.min(500, Math.max(1, parseInt($('limit').value, 10) || 100));
            const sort = $('sort').value;

            lastRack = rack;
            showStatus('Unscrambling ' + rack.toUpperCase() + '...');
            hideError();

            const url = `${API}/unscramble/${encodeURIComponent(rack)}?sort=${sort}&limit=${limit}&minLength=${minLength}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Request failed');
                renderResults(data);
                hideStatus();
            } catch (err) {
                hideStatus();
                flashError('Could not reach WordSoHard: ' + err.message);
            }
        }

        function renderResults(data) {
            $('results-section').classList.remove('hidden');
            $('result-count').textContent = `(${data.count} found${data.truncated ? `, showing ${data.returned}` : ''})`;

            const note = $('anagram-note');
            if (data.anagrams && data.anagrams.length) {
                note.textContent = 'Full rack: ' + data.anagrams.join(', ').toUpperCase();
                note.classList.remove('hidden');
            } else {
                note.classList.add('hidden');
            }

            const grid = $('words');
            grid.innerHTML = '';
            if (!data.words.length) {
                grid.innerHTML = '<p class="col-span-full text-slate-400">No playable words for those tiles.</p>';
                return;
            }

            const anagramSet = new Set(data.anagrams || []);
            for (const w of data.words) {
                const card = document.createElement('button');
                card.className = 'word-card text-left bg-white border border-slate-200 rounded-xl p-3 shadow-sm hover:border-emerald-400 hover:shadow-md';
                const bingo = w.length >= 7 || anagramSet.has(w.word);
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="font-extrabold text-slate-900 uppercase tracking-wide">${w.word}</span>
                        <span class="text-sm font-bold text-emerald-600">${w.score}</span>
                    </div>
                    <div class="mt-1 flex items-center gap-2 text-xs text-slate-400">
                        <span>${w.length} letters</span>
                        ${bingo ? '<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-bold">BINGO</span>' : ''}
                    </div>`;
                card.addEventListener('click', () => showDefinition(w.word));
                grid.appendChild(card);
            }
        }

        async function showDefinition(word) {
            $('def-word').textContent = word.toUpperCase();
            $('def-body').innerHTML = '<p class="text-slate-400">Loading...</p>';
            $('def-attr').textContent = '';
            $('modal').classList.remove('hidden');
            try {
                const res = await fetch(`${API}/define/${encodeURIComponent(word)}`);
                const d = await res.json();
                let html = '';
                if (d.scrabble) {
                    html += `<div class="flex gap-3 mb-3 text-sm">
                        <span class="px-2 py-1 rounded-md bg-emerald-100 text-emerald-700 font-semibold">${d.scrabble.score} pts</span>
                        <span class="px-2 py-1 rounded-md ${d.scrabble.valid ? 'bg-slate-100 text-slate-600' : 'bg-red-100 text-red-600'}">${d.scrabble.valid ? 'Valid play' : 'Not valid'}</span>
                        ${d.scrabble.bingo ? '<span class="px-2 py-1 rounded-md bg-amber-100 text-amber-700 font-semibold">Bingo</span>' : ''}
                    </div>`;
                }
                if (d.phonetic) html += `<p class="italic text-slate-500 mb-2">${d.phonetic}</p>`;
                if (d.definitions && d.definitions.length) {
                    html += '<ol class="list-decimal list-inside space-y-2">' + d.definitions.map(def =>
                        `<li><span class="text-xs uppercase text-slate-400 font-semibold">${def.partOfSpeech || ''}</span> ${def.definition}</li>`
                    ).join('') + '</ol>';
                } else {
                    html += '<p class="text-slate-400">No definition found.</p>';
                }
                $('def-body').innerHTML = html;
                $('def-attr').textContent = d.attribution || 'Definitions by WordSoHard (https://wordsohard.com)';
            } catch (err) {
                $('def-body').innerHTML = '<p class="text-red-600">Could not load definition.</p>';
            }
        }

        // ---- status helpers ----
        let errorTimer;
        function showStatus(msg) { const s = $('status'); s.textContent = msg; s.classList.remove('hidden'); }
        function hideStatus() { $('status').classList.add('hidden'); }
        function flashError(msg) {
            const e = $('error');
            e.textContent = msg;
            e.classList.remove('hidden');
            clearTimeout(errorTimer);
            errorTimer = setTimeout(hideError, 4000);
        }
        function hideError() { $('error').classList.add('hidden'); }

        // ---- events ----
        $('rack-input').addEventListener('input', (e) => setTiles(e.target.value));
        $('clear-rack').addEventListener('click', () => setTiles(''));
        $('solve').addEventListener('click', unscramble);
        $('min-length').addEventListener('keydown', (e) => { if (e.key === 'Enter') unscramble(); });
        $('limit').addEventListener('keydown', (e) => { if (e.key === 'Enter') unscramble(); });
        $('add-player').addEventListener('click', () => {
            const n = players.length + 1;
            players.push({ id: Date.now(), name: 'Player ' + n, tiles: '' });
            activeId = players[players.length - 1].id;
            savePlayers(); renderPlayers(); renderRack();
        });
        $('close-modal').addEventListener('click', () => $('modal').classList.add('hidden'));
        $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').classList.add('hidden'); });

        // ---- init ----
        players = loadPlayers();
        activeId = players[0].id;
        buildKeyboard();
        renderPlayers();
        renderRack();
        if (players[0].tiles) unscramble();
    </script>
</body>
</html>
